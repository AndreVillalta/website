<section id="acto-00" class="hero" aria-labelledby="titulo-hero">
  <!--
    Telon: dos paneles opacos POR ENCIMA del contenido. El titular ya esta
    pintado debajo desde el primer fotograma, asi que el LCP no depende de
    que termine esta animacion.
  -->
  <div class="telon" aria-hidden="true">
    <div class="panel izq"></div>
    <div class="panel der"></div>
    <div class="costura"></div>
  </div>

  <div class="frame contenido">
    <div class="bloque">
      <p class="eyebrow rotulo entrada">
        00 <span class="sep">/</span> Seguridad <span class="punto">&#183;</span> Salud Ocupacional
        <span class="punto">&#183;</span> Medio Ambiente <span class="punto">&#183;</span> Calidad
      </p>

      <!--
        Mismo lockup horizontal que el header (isotipo + "Consultores"), no una
        copia del trazado: un solo archivo como fuente de la marca, y el
        navegador lo sirve de cache porque el header ya lo pidio.
      -->
      <img src="logo-header-desktop.svg" alt="GB Consultores" class="marca-hero entrada" />

      <!-- Elemento LCP: se pinta de inmediato, sin opacidad ni recorte. -->
      <h1 id="titulo-hero" class="titular">
        Gestionamos riesgos,<br />
        <span class="oro">impulsamos organizaciones.</span>
      </h1>

      <p class="bajada entrada">
        Acompanamos a empresas e instituciones en Seguridad, Salud Ocupacional,
        Medio Ambiente y Calidad.
      </p>

      <a href="#acto-01" class="indicador entrada" [class.oculto]="scrolleado()">
        <span class="linea" aria-hidden="true"></span>
        Deslice para explorar
      </a>
    </div>
  </div>
</section>
